<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="lifestyleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE66D" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#FF6B35" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF5C8A" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>
    <filter id="glassBlur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" rx="32" fill="url(#lifestyleBg)"/>
  <rect width="800" height="600" rx="32" fill="url(#sunGlow)"/>

  <!-- Decorative stylized glassware & bubbles scene -->
  <g opacity="0.35">
    <circle cx="150" cy="180" r="110" fill="#FFF9F0"/>
    <circle cx="680" cy="140" r="140" fill="#B8F36B"/>
    <circle cx="650" cy="460" r="120" fill="#FFE66D"/>
    <circle cx="200" cy="480" r="90" fill="#FFF9F0"/>
  </g>

  <!-- Stylized Glass Tumbler Graphic -->
  <g transform="translate(260, 90)">
    <!-- Glass body -->
    <path d="M 50,70 L 70,360 C 70,390 110,400 140,400 C 170,400 210,390 210,360 L 230,70 Z" fill="#FFF9F0" fill-opacity="0.25" stroke="#FFFFFF" stroke-width="4"/>
    <!-- Liquid in glass -->
    <path d="M 58,160 L 72,355 C 72,375 110,385 140,385 C 170,385 208,375 208,355 L 222,160 Q 140,180 58,160 Z" fill="#FF5C8A" fill-opacity="0.7"/>
    
    <!-- Ice cubes in glass -->
    <rect x="90" y="180" width="45" height="45" rx="8" fill="#FFFFFF" fill-opacity="0.5" stroke="#FFF" stroke-width="2" transform="rotate(15 110 200)"/>
    <rect x="145" y="210" width="40" height="40" rx="8" fill="#FFFFFF" fill-opacity="0.5" stroke="#FFF" stroke-width="2" transform="rotate(-20 165 230)"/>
    <rect x="105" y="260" width="50" height="45" rx="8" fill="#FFFFFF" fill-opacity="0.4" stroke="#FFF" stroke-width="2" transform="rotate(8 130 280)"/>

    <!-- Straw -->
    <line x1="80" y1="20" x2="160" y2="350" stroke="#FFE66D" stroke-width="12" stroke-linecap="round"/>
    <line x1="80" y1="20" x2="160" y2="350" stroke="#FF6B35" stroke-width="4" stroke-dasharray="16 16" stroke-linecap="round"/>

    <!-- Mint Leaves -->
    <path d="M 60,65 C 30,50 35,20 65,35 C 95,20 100,50 70,65 Z" fill="#B8F36B" stroke="#2E5507" stroke-width="2"/>
    <path d="M 65,35 L 65,65" stroke="#2E5507" stroke-width="1.5"/>

    <!-- Fizz bubbles rising -->
    <circle cx="100" cy="140" r="8" fill="#FFF" fill-opacity="0.8"/>
    <circle cx="130" cy="110" r="6" fill="#FFF" fill-opacity="0.7"/>
    <circle cx="170" cy="130" r="9" fill="#FFF" fill-opacity="0.8"/>
    <circle cx="150" cy="90" r="5" fill="#FFF" fill-opacity="0.9"/>
    <circle cx="120" cy="70" r="7" fill="#FFF" fill-opacity="0.9"/>
  </g>

  <!-- Floating Citrus Slices -->
  <g transform="translate(540, 240) rotate(25)">
    <circle cx="50" cy="50" r="48" fill="#FF6B35"/>
    <circle cx="50" cy="50" r="44" fill="#FFF9F0"/>
    <circle cx="50" cy="50" r="38" fill="#FFE66D"/>
    <!-- Segments -->
    <path d="M 50,50 L 50,14 A 36 36 0 0 1 76,26 Z" fill="#FF6B35"/>
    <path d="M 50,50 L 76,26 A 36 36 0 0 1 86,52 Z" fill="#FF6B35"/>
    <path d="M 50,50 L 86,52 A 36 36 0 0 1 74,78 Z" fill="#FF6B35"/>
    <path d="M 50,50 L 74,78 A 36 36 0 0 1 48,86 Z" fill="#FF6B35"/>
    <path d="M 50,50 L 48,86 A 36 36 0 0 1 24,74 Z" fill="#FF6B35"/>
    <path d="M 50,50 L 24,74 A 36 36 0 0 1 14,48 Z" fill="#FF6B35"/>
    <path d="M 50,50 L 14,48 A 36 36 0 0 1 26,24 Z" fill="#FF6B35"/>
    <path d="M 50,50 L 26,24 A 36 36 0 0 1 50,14 Z" fill="#FF6B35"/>
    <circle cx="50" cy="50" r="8" fill="#FFF9F0"/>
  </g>

  <!-- Big Central Floating Badge -->
  <rect x="150" y="460" width="500" height="90" rx="20" fill="#181818" fill-opacity="0.92" stroke="#FFF9F0" stroke-width="2"/>
  <text x="400" y="498" font-family="'Fredoka', sans-serif" font-weight="800" font-size="20" fill="#FFE66D" text-anchor="middle" letter-spacing="2">LIFESTYLE MEDIA PLACEHOLDER</text>
  <text x="400" y="526" font-family="monospace" font-size="13" fill="#FFF9F0" text-anchor="middle" fill-opacity="0.85">Replace with: assets/images/brand-lifestyle.jpg (800 × 600px)</text>
</svg>
