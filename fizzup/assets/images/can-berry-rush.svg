<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" width="100%" height="100%">
  <defs>
    <!-- Aluminum rim gradients -->
    <linearGradient id="metalRimBerry" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#999"/>
      <stop offset="25%" stop-color="#E2E2E2"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#CCCCCC"/>
      <stop offset="100%" stop-color="#777"/>
    </linearGradient>

    <!-- Berry Rush body gradient -->
    <linearGradient id="berryCanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C71D57"/>
      <stop offset="18%" stop-color="#FF5C8A"/>
      <stop offset="45%" stop-color="#FFA8C1"/>
      <stop offset="70%" stop-color="#FF5C8A"/>
      <stop offset="100%" stop-color="#940D3C"/>
    </linearGradient>

    <!-- Metallic cylinder highlight overlay -->
    <linearGradient id="sheenGradBerry" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </linearGradient>

    <radialGradient id="bubbleGradBerry" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#FFE66D" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF5C8A" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop shadow filter -->
    <filter id="softShadowBerry" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="16" flood-color="#181818" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Can Group -->
  <g filter="url(#softShadowBerry)">
    <!-- Bottom tapered base -->
    <path d="M 85,580 L 100,635 C 100,645 130,652 200,652 C 270,652 300,645 300,635 L 315,580 Z" fill="url(#metalRimBerry)"/>
    
    <!-- Main Can Body -->
    <rect x="75" y="110" width="250" height="475" rx="20" fill="url(#berryCanGrad)"/>

    <!-- Specular / Metallic Sheen overlay -->
    <rect x="75" y="110" width="250" height="475" rx="20" fill="url(#sheenGradBerry)"/>

    <!-- Decorative Wave Patterns on can -->
    <path d="M 75,300 Q 140,360 200,290 T 325,320 L 325,480 Q 240,510 200,450 T 75,470 Z" fill="#FFFFFF" fill-opacity="0.2"/>
    
    <!-- Bubbles on can -->
    <circle cx="115" cy="210" r="14" fill="url(#bubbleGradBerry)"/>
    <circle cx="285" cy="190" r="10" fill="url(#bubbleGradBerry)"/>
    <circle cx="135" cy="380" r="12" fill="url(#bubbleGradBerry)"/>
    <circle cx="290" cy="430" r="16" fill="url(#bubbleGradBerry)"/>
    <circle cx="160" cy="510" r="11" fill="url(#bubbleGradBerry)"/>

    <!-- Top tapered collar -->
    <path d="M 75,125 L 98,62 C 105,52 140,48 200,48 C 260,48 295,52 302,62 L 325,125 Z" fill="url(#metalRimBerry)"/>

    <!-- Can Top Rim / Lip -->
    <ellipse cx="200" cy="52" rx="98" ry="16" fill="url(#metalRimBerry)" stroke="#ffffff" stroke-width="2"/>
    <ellipse cx="200" cy="51" rx="88" ry="12" fill="#E8E8E8" stroke="#B0B0B0" stroke-width="1.5"/>

    <!-- Pop Tab -->
    <rect x="188" y="44" width="24" height="24" rx="6" fill="#D0D0D0" stroke="#888" stroke-width="1.5"/>
    <circle cx="200" cy="54" r="5" fill="#B0B0B0"/>

    <!-- Brand Typography: FIZZUP -->
    <text x="200" y="275" font-family="'Fredoka', 'Impact', sans-serif" font-weight="900" font-size="62" fill="#FFFFFF" text-anchor="middle" letter-spacing="3" transform="rotate(-6 200 275)">FIZZUP</text>

    <!-- Starburst / Accent badge -->
    <rect x="125" y="315" width="150" height="34" rx="17" fill="#181818" transform="rotate(-6 200 315)"/>
    <text x="200" y="338" font-family="'Fredoka', 'Arial Black', sans-serif" font-weight="800" font-size="16" fill="#FFE66D" text-anchor="middle" letter-spacing="2" transform="rotate(-6 200 315)">BERRY RUSH</text>

    <!-- Small details -->
    <text x="200" y="385" font-family="sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" fill-opacity="0.9" text-anchor="middle" letter-spacing="2">SPARKLING SODA • 330ML</text>
    
    <text x="200" y="415" font-family="sans-serif" font-weight="600" font-size="11" fill="#FFF9F0" text-anchor="middle" letter-spacing="1">WILD RASPBERRY &amp; HIBISCUS</text>

    <!-- Berry graphic icon on can -->
    <g transform="translate(180, 435)">
      <circle cx="20" cy="20" r="14" fill="#FFE66D"/>
      <circle cx="10" cy="32" r="11" fill="#FFE66D" fill-opacity="0.8"/>
      <circle cx="30" cy="32" r="11" fill="#FFE66D" fill-opacity="0.8"/>
      <circle cx="20" cy="42" r="9" fill="#FFE66D" fill-opacity="0.9"/>
      <path d="M 20,10 Q 15,0 8,5 Q 18,7 20,10" fill="#B8F36B"/>
    </g>

    <!-- Condensation droplets -->
    <ellipse cx="105" cy="260" rx="3" ry="5" fill="#FFFFFF" fill-opacity="0.75"/>
    <ellipse cx="290" cy="310" rx="3.5" ry="6" fill="#FFFFFF" fill-opacity="0.75"/>
    <ellipse cx="130" cy="420" rx="2.5" ry="4" fill="#FFFFFF" fill-opacity="0.75"/>
    <ellipse cx="275" cy="470" rx="3" ry="5" fill="#FFFFFF" fill-opacity="0.75"/>

    <!-- Placeholder Badge Overlay -->
    <rect x="90" y="525" width="220" height="26" rx="6" fill="#181818" fill-opacity="0.85"/>
    <text x="200" y="542" font-family="monospace" font-size="10.5" fill="#FF5C8A" text-anchor="middle" font-weight="bold">PLACEHOLDER: BERRY RUSH</text>
  </g>
</svg>
